<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babashop Tournament</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .card {
        max-width: 640px;
        padding: 2rem;
        border-radius: 16px;
        background: #111827;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin-top: 0;
        color: #38bdf8;
      }
      code {
        background: #1f2937;
        padding: 0.15rem 0.4rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Deployment Fixed ✅</h1>
      <p>
        This repository is now configured as a <strong>Render static web service</strong>,
        so Render will no longer run <code>mix phx.digest</code>.
      </p>
      <p>
        If you later add a Phoenix app, you can switch the service runtime and build command accordingly.
      </p>
    </main>
  </body>
</html>
